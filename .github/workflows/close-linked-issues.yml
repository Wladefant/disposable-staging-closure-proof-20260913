# staging-closure-normalizer: v2
# Native closing keywords work only on the default branch; our trunk is staging.
# This replaces the existing normalizer, not a second competing closer.
#
# NON-GOALS: this is issue bookkeeping, NOT review, QA, deployment attestation,
# proof that a defect is fixed, or permission to promote anything. It never sets
# Project fields (GitHub's own closed-item automation may move a card to Done).
# Hold labels must be present BEFORE merge. A pending-verification comment is
# evidence of a merge, never evidence of verification. Remove holds and close
# manually only after the applicable evidence exists; this is NOT a QA watcher.
#
# Explicit closing declarations in body/commit messages, including prose and
# list items: 'Closes #123' or 'Fixes owner/repo#123'. Each target needs its own
# verb. No titles, bare mentions, quoted/code examples, cross-repository targets
# or inferred trailing '#2' in 'Closes #1, #2'. Existing valid inline declarations
# remain supported; this is not a new issue-template syntax requirement.
#
# No historical backfill: the actual merge commit must contain this v2 marker.
# Existing bot receipts (including legacy ones) block repeat writes/reclosure.
# If a receipt was posted but closing failed, a replay leaves the issue open
# for manual reconciliation instead of risking overriding a human reopening.
# Fork PRs are skipped because pull_request tokens are read-only for forks.
# Do not change to pull_request_target: this copy must work from staging,
# without installing anything on the production/default branch.
# No checkout, eval of fetched code, shell step, PR-title use, or expression
# interpolation of PR text. API text is parsed as data inside a pinned action.
name: Close linked issues on staging merge

on:
  pull_request:
    types: [closed]
    branches: [staging]

permissions:
  issues: write
  pull-requests: read
  contents: read # Read this workflow at the actual merge SHA; no checkout.

concurrency:
  group: staging-issue-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  close-linked-issues:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'staging' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;
            const event = context.payload.pull_request;
            const rows = [];
            async function finish(reason) {
              core.info(reason);
              await core.summary.addHeading('Staging issue bookkeeping')
                .addRaw(`${reason}\n\nNot review, QA, deployment or verified completion.\n`)
                .addTable([['Issue', 'Disposition'], ...rows]).write();
            }
            if (context.eventName !== 'pull_request' || context.payload.action !== 'closed' ||
                event?.merged !== true || event.base?.ref !== 'staging' ||
                event.head?.repo?.full_name?.toLowerCase() !== repository.toLowerCase()) {
              await finish('Ignored: not a same-repository merged staging event.');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: event.number });
            if (pr.merged !== true || pr.state !== 'closed' || pr.base.ref !== 'staging' ||
                pr.base.repo.full_name.toLowerCase() !== repository.toLowerCase() ||
                pr.head.repo?.full_name?.toLowerCase() !== repository.toLowerCase() ||
                !/^[a-f0-9]{40}$/i.test(pr.merge_commit_sha || '') ||
                pr.merge_commit_sha !== event.merge_commit_sha) {
              await finish('Ignored: API does not confirm this exact staging merge.');
              return;
            }
            const { data: version } = await github.rest.repos.getContent({ owner, repo,
              path: '.github/workflows/close-linked-issues.yml', ref: pr.merge_commit_sha });
            if (version.encoding !== 'base64' ||
                !Buffer.from(version.content, 'base64').toString('utf8')
                  .startsWith('# staging-closure-normalizer: v2\n')) {
              await finish('Historical merge predates v2: no backfill or issue writes.');
              return;
            }
            // GitHub caps listCommits at 250, even with pagination. Fail before
            // writes rather than silently treating an incomplete list as complete.
            if (!Number.isInteger(pr.commits) || pr.commits > 250) {
              throw new Error('Commit list exceeds API capacity; reconcile this PR manually.');
            }
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            if (commits.length !== pr.commits) throw new Error('Incomplete commit list; no writes.');

            function references(text) {
              const result = new Set();
              let fence = null;
              // An unterminated HTML comment hides the remainder, fail closed.
              text = (text || '').replace(/<!--[\s\S]*?(?:-->|$)/g, '\n');
              for (let line of text.split(/\r?\n/)) {
                const delimiter = line.match(/^ {0,3}(`{3,}|~{3,})(.*)$/);
                if (fence) {
                  if (delimiter && delimiter[1][0] === fence[0] &&
                      delimiter[1].length >= fence.length && !delimiter[2].trim()) fence = null;
                  continue;
                }
                if (delimiter) { fence = delimiter[1]; continue; }
                if (/^(?: {4}|\t|\s*>)/.test(line)) continue;
                line = line.replace(/(`+)[\s\S]*?\1/g, '[code]');
                if (/<\/?[A-Za-z][^>]*>/.test(line)) continue;
                // Keep existing inline declarations; never extend an instruction
                // to a bare mention or match a numeric prefix of a different URL.
                const pattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\b\s*:?\s*(#([1-9]\d*)|([\w.-]+\/[\w.-]+)#([1-9]\d*)|https:\/\/github\.com\/([\w.-]+\/[\w.-]+)\/issues\/([1-9]\d*))(?![\w/#?=&%-])/gi;
                for (const match of line.matchAll(pattern)) {
                  if (/\b(?:not|never|don't|doesn't|example)\b/i.test(line.slice(0, match.index))) continue;
                  const targetRepo = match[3] || match[5] || repository;
                  const number = Number(match[2] || match[4] || match[6]);
                  if (targetRepo.toLowerCase() === repository.toLowerCase() && Number.isSafeInteger(number)) result.add(number);
                }
              }
              return result;
            }
            const numbers = references(pr.body);
            for (const commit of commits) {
              references(commit.commit.message).forEach(number => numbers.add(number));
            }
            if (!numbers.size) {
              await finish('No explicit same-repository closing declarations: no issue writes.');
              return;
            }
            // Canonical taxonomy plus retained legacy holds. Positive verification
            // labels never override a hold; 'testing' is an area, not a QA hold.
            const holds = new Set(['state:needs-qa', 'needs:qa', 'needs-reproduction',
              'needs-ddl-apply', 'state:awaiting-auth', 'needs:decision',
              'state:needs-decision', 'state:blocked']);
            const heldBy = issue => issue.labels.map(label =>
              (typeof label === 'string' ? label : label.name).toLowerCase()).filter(label => holds.has(label));
            const prUrl = `https://github.com/${repository}/pull/${pr.number}`;
            const mergeUrl = `https://github.com/${repository}/commit/${pr.merge_commit_sha}`;
            for (const number of [...numbers].sort((a, b) => a - b)) {
              const args = { owner, repo, issue_number: number };
              let issue;
              try { ({ data: issue } = await github.rest.issues.get(args)); }
              catch (error) {
                if (error.status !== 404) throw error;
                rows.push([String(number), 'Missing issue; skipped']);
                continue;
              }
              if (issue.pull_request || issue.state !== 'open') {
                rows.push([String(number), issue.pull_request ? 'PR, not an issue; skipped' : 'Already closed; no writes']);
                continue;
              }
              const marker = `<!-- staging-closure:v2:${pr.number}:${pr.merge_commit_sha}:${number} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, { ...args, per_page: 100 });
              const previous = comments.some(comment => comment.user?.login === 'github-actions[bot]' &&
                (comment.body.includes(marker) ||
                 comment.body.startsWith(`Closed by ${prUrl}, merged into \`staging\`.`)));
              if (previous) {
                rows.push([String(number), 'Existing v2/legacy receipt; no writes or reclosure (manual reconciliation if open)']);
                continue;
              }
              // Re-read state/holds immediately before a write, including after
              // pagination. This is not an atomic lock against human label edits.
              ({ data: issue } = await github.rest.issues.get(args));
              if (issue.state !== 'open') { rows.push([String(number), 'Closed concurrently; skipped']); continue; }
              const holdLabels = heldBy(issue);
              const receipt = labels => `${marker}\nMerged into staging: ${prUrl}\n\nMerge commit: ${mergeUrl}\n\n` +
                (labels.length ? `**Verification/decision pending — left open.** Hold labels: ${labels.map(l => `\`${l}\``).join(', ')}.\n\n` :
                  'Explicit closing instruction accepted; closure requested by this workflow.\n\n') +
                'This is bookkeeping, not review, live QA, deployment attestation, or proof of defect resolution. ' +
                'If still open, reconcile manually after checking evidence; replay never overrides a reopening.';
              const { data: comment } = await github.rest.issues.createComment({ ...args, body: receipt(holdLabels) });
              if (holdLabels.length) {
                core.warning(`Issue ${number}: verification/decision pending; left open.`);
                rows.push([String(number), `Left open: ${holdLabels.join(', ')}`]);
                continue;
              }
              ({ data: issue } = await github.rest.issues.get(args));
              const lateHolds = heldBy(issue);
              if (issue.state !== 'open' || lateHolds.length) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: comment.id,
                  body: receipt(lateHolds) + '\n\nClosure was not attempted: state/holds changed during processing.' });
                rows.push([String(number), 'State/holds changed; no closure']);
                continue;
              }
              await github.rest.issues.update({ ...args, state: 'closed', state_reason: 'completed' });
              rows.push([String(number), 'Closed from explicit instruction; not a QA claim']);
            }
            await finish('Processed explicit closing declarations; see per-issue dispositions.');
